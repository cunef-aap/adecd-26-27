project:
  type: book
  output-dir: docs

book:
  title: "Aprendizaje Automático: Predicción"
  subtitle: "G244 · Doble Grado ADE + Ciencia de Datos · CUNEF Universidad"
  chapters:
    - index.qmd
    - part: "Fundamentos del aprendizaje predictivo"
      chapters:
        - capitulos/01-senal-ruido.qmd
        - capitulos/02-aprender-minimizando.qmd
        - capitulos/03-modelos-lineales.qmd
    - part: "Evaluación y datos"
      chapters:
        - capitulos/04-evaluacion.qmd
        - capitulos/05-preparacion-datos.qmd
    - part: "Complejidad y generalización"
      chapters:
        - capitulos/06-complejidad.qmd
        - capitulos/07-regularizacion.qmd
        - capitulos/08-seleccion-dimension.qmd
    - part: "Otros métodos"
      chapters:
        - capitulos/09-arboles.qmd
    - part: "Hojas de problemas"
      chapters:
        - problemas/index.qmd
        - problemas/hoja-01.qmd
        # - problemas/hoja-01-soluciones.qmd
        - problemas/hoja-02.qmd
        # - problemas/hoja-02-soluciones.qmd
        - problemas/hoja-03.qmd
        # - problemas/hoja-03-soluciones.qmd
        - problemas/hoja-04.qmd
        # - problemas/hoja-04-soluciones.qmd
        - problemas/hoja-05.qmd
        # - problemas/hoja-05-soluciones.qmd
        - problemas/hoja-06.qmd
        # - problemas/hoja-06-soluciones.qmd
        - problemas/hoja-07.qmd
        - problemas/hoja-08.qmd
        - problemas/hoja-09.qmd
        # Una hoja por capitulo: hoja-NN es la del capitulo NN. Las hojas 4 a 9 son
        # esqueletos, pero se listan igualmente: sin listarlas aqui Quarto no las
        # renderiza, las copia como .qmd al directorio de salida, y los enlaces del
        # indice descargan el fuente en lugar de abrir una pagina.
        #
        # Para no publicar las soluciones basta con comentar las lineas *-soluciones
        # y quitar el enlace del pie de cada hoja.
  appendices:
    - curso/guia.qmd
    - curso/calendario.qmd
    - curso/evaluacion.qmd
    - curso/politica-ia.qmd
    - curso/proyecto.qmd
    - curso/algebra.qmd
    - curso/probabilidad.qmd
    - curso/indice-resultados.qmd
    - curso/glosario.qmd
    - curso/trazabilidad.qmd
  body-footer: |
    <br><br><span style="color:grey;">&#169; Roi Naveiro, CUNEF Universidad, 2026</span>
  sidebar:
    search: true
    logo: assets/img/cunef-logo.png
    logo-alt: "CUNEF Universidad"

format:
  html:
    theme: [cosmo, assets/custom.scss]
    css: assets/styles.css
    # Sangra la continuacion de las lineas de codigo que se parten, segun la
    # indentacion de cada linea. El porque, en el propio fichero.
    include-after-body: assets/sangrado-codigo.html
    number-depth: 0
    reference-location: margin
    fig-cap-location: margin
    callout-icon: false
    callout-appearance: minimal
    highlight-style: atom-one
    # Las lineas de codigo mas largas que el bloque se parten en lugar de
    # quedar cortadas al borde con una barra de desplazamiento.
    code-overflow: wrap
    title-block: none
    grid:
      body-width: 760px
      margin-width: 340px
      sidebar-width: 275px

lang: es

jupyter: aap

execute:
  # `freeze` es el mecanismo nativo de Quarto y no necesita jupyter-cache.
  freeze: auto

mermaid:
  theme: neutral

bibliography: referencias.bib

# Entornos numerados en español. Quarto numera por capítulo en proyectos `book`.
language:
  crossref-def-title: "Definición"
  crossref-thm-title: "Teorema"
  crossref-lem-title: "Lema"
  crossref-cor-title: "Corolario"
  crossref-prp-title: "Proposición"
  crossref-exm-title: "Ejemplo"
  crossref-exr-title: "Ejercicio"
  crossref-fig-title: "Figura"
  crossref-eq-title: "Ecuación"
  proof-title: "Demostración"
  remark-title: "Observación"

# Los bloques .sol / .trampa / .cajanegra son divs con estilo en assets/styles.css.
# NO dependen de ninguna extensión, por lo que el sitio renderiza con cualquier Quarto.
#
# Opcional, cuando Quarto >= 1.5 esté instalado, para que las soluciones se plieguen:
#   quarto add coatless-quarto/custom-callout
# y descomentar:
#
# custom-callout:
#   sol:       {icon-symbol: "📝", color: "pink"}
#   trampa:    {icon-symbol: "⚠️", color: "orange"}
#   cajanegra: {icon-symbol: "⬛", color: "grey"}
# filters:
#   - custom-callout
#   - scripts/collapse-solucion.lua
