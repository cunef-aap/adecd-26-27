project:
  type: book
  output-dir: docs

book:
  title: "Aprendizaje Automático: Predicción"
  subtitle: "G244 · Doble Grado ADE + Ciencia de Datos · CUNEF Universidad"
  # <<< generado por scripts/publicado.py a partir de contenido.txt
  chapters:
    - index.qmd
    - part: "Fundamentos del aprendizaje predictivo"
      chapters:
        - capitulos/01-senal-ruido.qmd
    - part: "Hojas de problemas"
      chapters:
        - problemas/hoja-01.qmd
  appendices:
    - curso/colab.qmd
    - curso/evaluacion.qmd
    - curso/algebra.qmd
    - curso/probabilidad.qmd
  # >>> fin del bloque generado
format:
  html:
    # MathJax 4 reparte su tipografia en un fichero por variante y los carga por separado:
    # cuando el de la caligrafica no llega, `\mathcal{D}` sale como un cuadrado. La salida
    # SVG lleva los trazos de cada glifo dentro del propio JS, de modo que no descarga
    # ninguna tipografia y no puede faltar un glifo.
    html-math-method:
      method: mathjax
      url: https://cdn.jsdelivr.net/npm/mathjax@4/tex-svg.js
    theme: [cosmo, assets/custom.scss]
    css: assets/styles.css
    # Sangra la continuacion de las lineas de codigo que se parten, segun la
    # indentacion de cada linea. El porque, en el propio fichero.
    include-after-body: assets/sangrado-codigo.html
    number-depth: 0
    reference-location: margin
    fig-cap-location: margin
    callout-icon: false
    callout-appearance: minimal
    highlight-style: atom-one
    # Las lineas de codigo mas largas que el bloque se parten en lugar de
    # quedar cortadas al borde con una barra de desplazamiento.
    code-overflow: wrap
    title-block: none
    grid:
      body-width: 760px
      margin-width: 340px
      sidebar-width: 275px

lang: es

jupyter: aap

execute:
  # `freeze` es el mecanismo nativo de Quarto y no necesita jupyter-cache.
  freeze: auto

mermaid:
  theme: neutral

bibliography: referencias.bib

# Entornos numerados en español. Quarto numera por capítulo en proyectos `book`.
language:
  crossref-def-title: "Definición"
  crossref-thm-title: "Teorema"
  crossref-lem-title: "Lema"
  crossref-cor-title: "Corolario"
  crossref-prp-title: "Proposición"
  crossref-exm-title: "Ejemplo"
  crossref-exr-title: "Ejercicio"
  crossref-fig-title: "Figura"
  crossref-eq-title: "Ecuación"
  proof-title: "Demostración"
  remark-title: "Observación"

# Los bloques .sol / .trampa / .cajanegra son divs con estilo en assets/styles.css.
# NO dependen de ninguna extensión, por lo que el sitio renderiza con cualquier Quarto.
#
# Opcional, cuando Quarto >= 1.5 esté instalado, para que las soluciones se plieguen:
#   quarto add coatless-quarto/custom-callout
# y descomentar:
#
# custom-callout:
#   sol:       {icon-symbol: "📝", color: "pink"}
#   trampa:    {icon-symbol: "⚠️", color: "orange"}
#   cajanegra: {icon-symbol: "⬛", color: "grey"}
# filters:
#   - custom-callout
#   - scripts/collapse-solucion.lua
