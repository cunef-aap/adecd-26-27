# Perfil publico. La lista se genera exclusivamente desde contenido.txt.
project:
  output-dir: docs
  render:
    - "*.qmd"
    - "!problemas/*-soluciones.qmd"

format:
  html:
    filters:
      - scripts/strip-delims.lua
      # Desactiva los enlaces a lo que todavia no se publica. Sin el, Quarto copia el .qmd
      # fuente de esos capitulos a docs/ y los publicaria.
      - scripts/enlaces-publicados.lua

book:
  # <<< generado por scripts/publicado.py a partir de contenido.txt
  chapters:
    - index.qmd
    - part: "Fundamentos del aprendizaje predictivo"
      chapters:
        - capitulos/01-senal-ruido.qmd
        - capitulos/02-aprender-minimizando.qmd
        - capitulos/03-modelos-lineales.qmd
    - part: "Evaluación y datos"
      chapters:
        - capitulos/04-evaluacion.qmd
    - part: "Hojas de problemas"
      chapters:
        - problemas/hoja-01.qmd
        - problemas/hoja-02.qmd
        - problemas/hoja-03.qmd
        - problemas/hoja-04.qmd
  appendices:
    - curso/colab.qmd
    - curso/clases-python.qmd
    - curso/evaluacion.qmd
    - curso/algebra.qmd
    - curso/probabilidad.qmd
  # >>> fin del bloque generado
