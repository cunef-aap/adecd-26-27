project:
  type: website
  output-dir: docs/live-notebooks
  # Solo los capítulos generan cuaderno. Sin esta lista, Quarto recorre el
  # árbol entero, entra en docs/ y falla al resolver los include relativos de
  # cualquier .qmd que haya quedado allí.
  render:
    - capitulos/*.qmd
    # El anexo de Colab tambien genera cuaderno: es el primer contacto con la herramienta
    # y se sigue ejecutandolo.
    - curso/colab.qmd

format:
  ipynb:
    crossref: false
    number-sections: false
    number-figures: false

filters:
  - quarto
  # Los cuadernos de los capitulos van COMPLETOS, sin huecos, decidido en agosto de 2026.
  # Antes iba aqui strip-code.lua, que sustituia el codigo entre centinelas por un
  # `# TODO: completar en clase`; ahora va strip-delims.lua, que solo borra las lineas
  # `#---` y deja el codigo entero. Los centinelas siguen en las fuentes porque marcan
  # el trozo que se escribe en directo al explicar.
  - scripts/strip-delims.lua
  - scripts/restore-cells.lua
  - scripts/clean-eqref.lua

wrap: none

jupyter: aap
